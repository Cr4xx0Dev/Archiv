<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Expressive Archiv</title>
    <!-- Material Symbols Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #121212;
            --surface-1: #1e1e1e;
            --surface-2: #282828;
            --surface-3: #333333;
            --primary-container: #383838;
            --on-primary-container: #ffffff;
            --accent: #8ab4f8;
            --text-main: #f0f0f0;
            --text-sub: #aaaaaa;
            --outline: #444444;
            --radius-xl: 28px;
            --radius-l: 20px;
            --radius-m: 12px;
            --transition-easing: cubic-bezier(0.2, 0, 0, 1);
            --transition-fast: all 0.2s var(--transition-easing);
            --transition-smooth: all 0.35s var(--transition-easing);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 80px;
            background-color: var(--surface-1);
            border-right: 1px solid var(--outline);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            transition: var(--transition-smooth);
            z-index: 100;
            flex-shrink: 0;
        }

        .sidebar.expanded {
            width: 260px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 24px;
            transition: var(--transition-fast);
        }

        .toggle-btn:hover {
            background-color: var(--surface-2);
            transform: scale(1.05);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: var(--radius-xl);
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
            overflow: hidden;
            background-color: transparent;
            user-select: none;
        }

        .nav-item:hover {
            background-color: var(--surface-2);
            color: var(--text-main);
            transform: translateX(3px);
        }

        .nav-item.active {
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            font-weight: 600;
        }

        .nav-item .material-symbols-outlined {
            font-size: 24px;
        }

        .nav-text {
            opacity: 0;
            transition: opacity 0.25s var(--transition-easing);
            font-size: 0.95rem;
        }

        .sidebar.expanded .nav-text {
            opacity: 1;
        }

        /* CONTENT & SECTIONS */
        .main-content {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .page-section {
            display: none;
            animation: fadeInSlide 0.35s var(--transition-easing) forwards;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HERO & GIF SHOWCASE */
        .hero-banner {
            background: linear-gradient(135deg, var(--surface-1), var(--surface-2));
            border: 1px solid var(--outline);
            border-radius: var(--radius-xl);
            padding: 32px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .hero-text h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hero-text p {
            color: var(--text-sub);
            font-size: 1.05rem;
            max-width: 500px;
        }

        .gif-showcase {
            width: 200px;
            height: 140px;
            border-radius: var(--radius-l);
            overflow: hidden;
            border: 1px solid var(--outline);
            flex-shrink: 0;
            background-color: var(--surface-3);
        }

        .gif-showcase img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* SEARCH BAR */
        .search-bar-container {
            margin-bottom: 24px;
            position: relative;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background-color: var(--surface-1);
            border: 1px solid var(--outline);
            border-radius: var(--radius-xl);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: var(--transition-fast);
        }

        .search-input:focus {
            border-color: var(--accent);
            background-color: var(--surface-2);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            pointer-events: none;
        }

        /* GRID & CARDS */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--surface-1);
            border-radius: var(--radius-xl);
            border: 1px solid var(--outline);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #666;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        .card-img-wrapper {
            width: 100%;
            height: 180px;
            background-color: var(--surface-2);
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.03);
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .btn-more {
            background-color: var(--surface-2);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-l);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-more .icon-expand {
            transition: transform 0.25s ease;
        }

        .btn-more.open .icon-expand {
            transform: rotate(180deg);
        }

        .card-description {
            display: none;
            padding: 0 20px 16px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .card-description.show {
            display: block;
        }

        .card-actions {
            padding: 16px 20px;
            border-top: 1px solid var(--surface-2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .accordion-btn {
            background: var(--surface-2);
            border: none;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-m);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .accordion-content {
            display: none;
            padding: 10px 14px;
            background: var(--bg-color);
            border-radius: var(--radius-m);
            font-size: 0.85rem;
            color: var(--text-sub);
            word-break: break-all;
        }

        .accordion-content.show {
            display: block;
        }

        .accordion-content a {
            color: var(--accent);
            text-decoration: underline;
        }

        .error-banner {
            background-color: #4a1515;
            color: #ff9999;
            padding: 16px;
            border-radius: var(--radius-m);
            border: 1px solid #882222;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; height: 100vh; }
            .main-content { margin-left: 80px; padding: 16px; }
            .hero-banner { flex-direction: column; }
            .gif-showcase { width: 100%; height: 160px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <ul class="nav-list">
            <li class="nav-item active" onclick="switchTab('home', this)">
                <span class="material-symbols-outlined">home</span>
                <span class="nav-text">Startseite</span>
            </li>
            <li class="nav-item" onclick="switchTab('minecraft', this)">
                <span class="material-symbols-outlined">sports_esports</span>
                <span class="nav-text">Minecraft</span>
            </li>
            <li class="nav-item" onclick="switchTab('android', this)">
                <span class="material-symbols-outlined">android</span>
                <span class="nav-text">Android & Apps</span>
            </li>
            <li class="nav-item" onclick="switchTab('scripte', this)">
                <span class="material-symbols-outlined">code</span>
                <span class="nav-text">Scripte</span>
            </li>
            <li class="nav-item" onclick="switchTab('misc', this)">
                <span class="material-symbols-outlined">folder_open</span>
                <span class="nav-text">Misc & Müll</span>
            </li>
        </ul>
    </nav>

    <!-- HAUPTBEREICH -->
    <main class="main-content">
        <div id="error-box" class="error-banner"></div>

        <!-- STARTSEITE -->
        <section id="page-home" class="page-section active">
            <div class="hero-banner">
                <div class="hero-text">
                    <h1>Material 3 Archiv</h1>
                    <p>Wähle eine Kategorie in der Menüleiste links oder nutze die Suche.</p>
                </div>
                <div class="gif-showcase">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXU2MGdhaGN1MWI3OW41OXd2YnM0Ym41OGs5ZTZ1YXA1OHlhMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L1R1tvI9svvAQQyVY9/giphy.gif" alt="GIF Banner">
                </div>
            </div>

            <h2 style="margin-bottom: 20px; font-weight: 500;">Übersicht</h2>
            <div class="project-grid" id="home-grid"></div>
        </section>

        <!-- KATEGORIE & SUCHE -->
        <section id="page-category" class="page-section">
            <h1 id="category-title" style="margin-bottom: 20px;">Kategorie</h1>
            
            <div class="search-bar-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="search" id="search-input" class="search-input" placeholder="In dieser Kategorie suchen..." oninput="handleSearch()">
            </div>

            <div class="project-grid" id="project-grid"></div>
        </section>
    </main>

    <script>
        let projects = [];
        let currentTab = 'home';
        let searchQuery = '';

        // SEITENSTART: LADE JSON
        window.addEventListener('DOMContentLoaded', () => {
            fetch('projects.json')
                .then(res => {
                    if (!res.ok) throw new Error("HTTP Fehler Status " + res.status);
                    return res.json();
                })
                .then(data => {
                    projects = data;
                    renderHome();
                })
                .catch(err => {
                    showError("<b>Fehler beim Laden der projects.json:</b><br>" + err.message + 
                              "<br><small>Tipp: Falls du die Datei lokal per Doppelklick geöffnet hast, nutze einen lokalen Server (z.B. Live Server in VS Code).</small>");
                });
        });

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.innerHTML = msg;
            errBox.style.display = 'block';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('expanded');
        }

        function switchTab(tab, element) {
            currentTab = tab;
            searchQuery = '';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            const homeSec = document.getElementById('page-home');
            const catSec = document.getElementById('page-category');

            if (tab === 'home') {
                homeSec.classList.add('active');
                catSec.classList.remove('active');
                renderHome();
            } else {
                homeSec.classList.remove('active');
                catSec.classList.add('active');

                const titles = {
                    'minecraft': 'Minecraft',
                    'android': 'Android & Apps',
                    'scripte': 'Scripte & Tools',
                    'misc': 'Misc & Müll / Archiv'
                };
                document.getElementById('category-title').innerText = titles[tab] || tab;
                renderCategoryCards();
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            renderCategoryCards();
        }

        function renderHome() {
            const grid = document.getElementById('home-grid');
            if (!projects || projects.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-sub);">Keine Projekte geladen.</p>';
                return;
            }
            grid.innerHTML = projects.slice(0, 6).map((p, i) => createCardHTML(p, i, 'home')).join('');
        }

        function renderCategoryCards() {
            const grid = document.getElementById('project-grid');
            
            // Vergleicht Kategorien schreibweisen-unabhängig (lowercase)
            const filtered = projects.filter(p => {
                const pCat = (p.category || '').toLowerCase();
                const targetCat = currentTab.toLowerCase();
                const matchesCat = pCat === targetCat;

                const nameMatch = (p.name || '').toLowerCase().includes(searchQuery);
                const descMatch = (p.description || '').toLowerCase().includes(searchQuery);
                
                return matchesCat && (nameMatch || descMatch);
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-sub); grid-column: 1/-1;">Keine Einträge für diese Kategorie / Suche gefunden.</p>';
                return;
            }

            grid.innerHTML = filtered.map((p, i) => createCardHTML(p, i, currentTab)).join('');
        }

        function createCardHTML(project, idx, prefix) {
            const safeName = (project.name || 'Projekt').replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
            const uid = `${prefix}-${project.id || idx}-${safeName}`;

            return `
                <div class="card">
                    <div class="card-img-wrapper">
                        <img src="${project.image || ''}" alt="${project.name || 'Bild'}" onerror="this.src='https://via.placeholder.com/400x200/282828/ffffff?text=Kein+Bild'">
                    </div>
                    <div class="card-header-bar">
                        <span class="card-title">${project.name || 'Unbenannt'}</span>
                        <button class="btn-more" id="btn-more-${uid}" onclick="toggleDetails('${uid}')">
                            Mehr
                            <span class="material-symbols-outlined icon-expand" style="font-size: 16px;">expand_more</span>
                        </button>
                    </div>
                    <div class="card-description" id="desc-${uid}">
                        ${project.description || 'Keine Beschreibung vorhanden.'}
                    </div>
                    <div class="card-actions">
                        ${project.sources ? `
                            <button class="accordion-btn" onclick="toggleAccordion('sources-${uid}')">
                                <span>Quellen / Links</span>
                                <span class="material-symbols-outlined" style="font-size: 16px;">link</span>
                            </button>
                            <div class="accordion-content" id="sources-${uid}">
                                <a href="${project.sources}" target="_blank" rel="noopener noreferrer">${project.sources}</a>
                            </div>
                        ` : ''}

                        ${project.tutorials ? `
                            <button class="accordion-btn" onclick="toggleAccordion('tut-${uid}')">
                                <span>Tutorial / Info</span>
                                <span class="material-symbols-outlined" style="font-size: 16px;">help_outline</span>
                            </button>
                            <div class="accordion-content" id="tut-${uid}">
                                ${project.tutorials}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function toggleDetails(uid) {
            const desc = document.getElementById(`desc-${uid}`);
            const btn = document.getElementById(`btn-more-${uid}`);
            if (desc) desc.classList.toggle('show');
            if (btn) btn.classList.toggle('open');
        }

        function toggleAccordion(id) {
            const content = document.getElementById(id);
            if (content) content.classList.toggle('show');
        }
    </script>
</body>
</html>

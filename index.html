<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Archiv</title>
    <!-- Material Symbols Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* ==========================================
           MATERIAL YOU (M3) DARK GREY THEME
           ========================================== */
        :root {
            --bg-color: #121212;
            --surface-1: #1e1e1e;
            --surface-2: #282828;
            --surface-3: #333333;
            --primary-container: #383838;
            --on-primary-container: #ffffff;
            --text-main: #f0f0f0;
            --text-sub: #aaaaaa;
            --outline: #444444;
            --radius-xl: 28px;
            --radius-l: 20px;
            --radius-m: 12px;
            --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==========================================
           SIDEBAR (AUSKLAPPBAR)
           ========================================== */
        .sidebar {
            width: 80px;
            background-color: var(--surface-1);
            border-right: 1px solid var(--outline);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            transition: var(--transition);
            z-index: 100;
            flex-shrink: 0;
        }

        .sidebar.expanded {
            width: 260px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .toggle-btn:hover {
            background-color: var(--surface-2);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: var(--radius-xl);
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            background-color: transparent;
        }

        .nav-item:hover {
            background-color: var(--surface-2);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            font-weight: 600;
        }

        .nav-item .material-symbols-outlined {
            font-size: 24px;
        }

        .nav-text {
            opacity: 0;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .sidebar.expanded .nav-text {
            opacity: 1;
        }

        /* ==========================================
           HAUPTINHALT & GRID
           ========================================== */
        .main-content {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* ==========================================
           EXPRESSIVE CARDS
           ========================================== */
        .card {
            background-color: var(--surface-1);
            border-radius: var(--radius-xl);
            border: 1px solid var(--outline);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #666;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card-img-wrapper {
            width: 100%;
            height: 180px;
            background-color: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(80%);
            transition: var(--transition);
        }

        .card:hover .card-img-wrapper img {
            filter: grayscale(0%);
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-more {
            background-color: var(--surface-2);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-l);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-more:hover {
            background-color: var(--surface-3);
        }

        .card-description {
            display: none;
            padding: 0 20px 16px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .card-description.show {
            display: block;
        }

        .card-actions {
            padding: 16px 20px;
            border-top: 1px solid var(--surface-2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.01);
        }

        .accordion-btn {
            background: var(--surface-2);
            border: none;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-m);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .accordion-btn:hover {
            background: var(--surface-3);
        }

        .accordion-content {
            display: none;
            padding: 10px 14px;
            background: var(--bg-color);
            border-radius: var(--radius-m);
            font-size: 0.85rem;
            color: var(--text-sub);
            word-break: break-all;
        }

        .accordion-content.show {
            display: block;
        }

        .accordion-content a {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .sidebar {
                position: fixed;
                height: 100vh;
            }
            .main-content {
                margin-left: 80px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <ul class="nav-list">
            <li class="nav-item active" onclick="filterCategory('minecraft', this)">
                <span class="material-symbols-outlined">sports_esports</span>
                <span class="nav-text">Minecraft</span>
            </li>
            <li class="nav-item" onclick="filterCategory('android', this)">
                <span class="material-symbols-outlined">android</span>
                <span class="nav-text">Android & Apps</span>
            </li>
            <li class="nav-item" onclick="filterCategory('scripte', this)">
                <span class="material-symbols-outlined">code</span>
                <span class="nav-text">Scripte</span>
            </li>
            <li class="nav-item" onclick="filterCategory('misc', this)">
                <span class="material-symbols-outlined">folder_open</span>
                <span class="nav-text">Misc & Müll</span>
            </li>
        </ul>
    </nav>

    <!-- HAUPTBEREICH -->
    <main class="main-content">
        <div class="header">
            <h1 id="category-title">Minecraft</h1>
        </div>

        <div class="project-grid" id="project-grid">
            <!-- Karten werden hier dynamisch eingefügt -->
        </div>
    </main>

    <script>
        let projects = [];
        let currentCategory = 'minecraft';

        // LÄDT DIE DATEN AUS DER PROJECTS.JSON
        fetch('projects.json')
            .then(res => res.json())
            .then(data => {
                projects = data;
                filterCategory('minecraft', document.querySelector('.nav-item.active'));
            })
            .catch(err => {
                console.error("Fehler beim Laden von projects.json:", err);
                document.getElementById('project-grid').innerHTML = '<p>Konnte projects.json nicht laden.</p>';
            });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('expanded');
        }

        function filterCategory(category, element) {
            currentCategory = category;
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            const titles = {
                'minecraft': 'Minecraft',
                'android': 'Android & Apps',
                'scripte': 'Scripte & Tools',
                'misc': 'Misc & Müll / Archiv'
            };
            document.getElementById('category-title').innerText = titles[category] || category;

            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';

            const filtered = projects.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-sub);">Noch keine Einträge in dieser Kategorie vorhanden.</p>';
                return;
            }

            filtered.forEach((project, index) => {
                const cardHTML = `
                    <div class="card">
                        <div class="card-img-wrapper">
                            <img src="${project.image}" alt="${project.name}">
                        </div>
                        <div class="card-header-bar">
                            <span class="card-title">${project.name}</span>
                            <button class="btn-more" onclick="toggleDetails(${index})">
                                Mehr
                                <span class="material-symbols-outlined" style="font-size: 16px;">expand_more</span>
                            </button>
                        </div>
                        <div class="card-description" id="desc-${index}">
                            ${project.description}
                        </div>
                        <div class="card-actions">
                            <button class="accordion-btn" onclick="toggleAccordion('sources-${index}')">
                                <span>Quellen / Links</span>
                                <span class="material-symbols-outlined" style="font-size: 16px;">link</span>
                            </button>
                            <div class="accordion-content" id="sources-${index}">
                                <a href="${project.sources}" target="_blank">${project.sources}</a>
                            </div>

                            <button class="accordion-btn" onclick="toggleAccordion('tut-${index}')">
                                <span>Tutorial / Info</span>
                                <span class="material-symbols-outlined" style="font-size: 16px;">help_outline</span>
                            </button>
                            <div class="accordion-content" id="tut-${index}">
                                ${project.tutorials}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function toggleDetails(index) {
            document.getElementById(`desc-${index}`).classList.toggle('show');
        }

        function toggleAccordion(id) {
            document.getElementById(id).classList.toggle('show');
        }
    </script>
</body>
</html>
